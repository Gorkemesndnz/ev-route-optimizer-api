<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Rota Optimizasyonu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .result-card {
            margin-top: 20px;
            display: none;
        }

        .loading {
            display: none;
        }

        .route-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">🚗 EV Rota Optimizasyonu</h3>
                    </div>
                    <div class="card-body">
                        <form id="routeForm">
                            <div class="mb-3">
                                <label for="startLocation" class="form-label">Başlangıç Noktası</label>
                                <input type="text" class="form-control" id="startLocation"
                                    placeholder="Örn: İstanbul, Türkiye" value="İstanbul, Türkiye" required>
                            </div>

                            <div class="mb-3">
                                <label for="endLocation" class="form-label">Varış Noktası</label>
                                <input type="text" class="form-control" id="endLocation"
                                    placeholder="Örn: Ankara, Türkiye" value="Ankara, Türkiye" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="vehicleModel" class="form-label">Araç Modeli</label>
                                    <select class="form-select" id="vehicleModel" required>
                                        <option value="mg4_51kwh">MG4 Electric 51 kWh</option>
                                        <option value="tesla_model_3_long_range">Tesla Model 3 Long Range</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="passengerCount" class="form-label">Yolcu Sayısı</label>
                                    <input type="number" class="form-control" id="passengerCount" placeholder="1"
                                        value="1" min="1" max="5" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="initialSoc" class="form-label">Başlangıç Batarya (%)</label>
                                    <input type="number" class="form-control" id="initialSoc" placeholder="80"
                                        value="80" min="10" max="100" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="extraLoad" class="form-label">Ek Yük (kg)</label>
                                    <input type="number" class="form-control" id="extraLoad" placeholder="0" value="0"
                                        min="0" max="500">
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    🗺️ Rota Planla
                                </button>
                            </div>
                        </form>

                        <div class="loading text-center mt-3">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Yükleniyor...</span>
                            </div>
                            <p class="mt-2">Rota hesaplanıyor...</p>
                        </div>
                    </div>
                </div>

                <div id="resultCard" class="card result-card">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">📍 Rota Sonuçları</h4>
                    </div>
                    <div class="card-body">
                        <div id="routeResults"></div>
                    </div>
                </div>

                <div id="errorCard" class="card result-card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">❌ Hata</h4>
                    </div>
                    <div class="card-body">
                        <div id="errorResults"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('routeForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Loading göster
            document.querySelector('.loading').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('errorCard').style.display = 'none';

            // Form verilerini al
            const formData = {
                start_location: document.getElementById('startLocation').value,
                end_location: document.getElementById('endLocation').value,
                vehicle_model_id: document.getElementById('vehicleModel').value,
                initial_soc_percent: parseInt(document.getElementById('initialSoc').value),
                extra_load_kg: parseInt(document.getElementById('extraLoad').value),
                preferred_charging_stops: [],
                avoid_tolls: false,
                optimize_for: "time"
            };

            try {
                const response = await fetch('/optimize_route', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                // Loading gizle
                document.querySelector('.loading').style.display = 'none';

                if (data.status === 'success' || data.status === 'multi_stop_plan_success' || data.total_distance_km > 0) {
                    showResults(data);
                } else {
                    showError(data);
                }

            } catch (error) {
                document.querySelector('.loading').style.display = 'none';
                showError({ status: 'error', detail: error.message });
            }
        });

        function showResults(data) {
            const resultsDiv = document.getElementById('routeResults');

            let html = `
                <div class="route-info">
                    <h5>📊 Rota Özeti</h5>
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Toplam Mesafe:</strong> ${data.total_distance_km.toFixed(1)} km</p>
                            <p><strong>Tahmini Süre:</strong> ${data.total_duration_minutes} dakika</p>
                            <p><strong>Toplam Tüketim:</strong> ${data.legs[0]?.consumption_kwh?.toFixed(2) || 'N/A'} kWh</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Başlangıç Batarya:</strong> ${data.legs[0]?.start_soc_percent || 'N/A'}%</p>
                            <p><strong>Varış Batarya:</strong> ${data.legs[0]?.arrival_soc_percent || 'N/A'}%</p>
                            <p><strong>CO2 Tasarrufu:</strong> ${data.total_co2_savings_kg.toFixed(2)} kg</p>
                        </div>
                    </div>
                </div>
            `;

            if (data.legs && data.legs.length > 0) {
                html += '<div class="route-info"><h5>🛣️ Rota Detayları</h5>';
                data.legs.forEach((leg, index) => {
                    html += `
                        <div class="mb-3 p-3 border rounded">
                            <p><strong>Bölüm ${index + 1}:</strong> ${leg.type === 'drive' ? '🚗 Sürüş' : '🔌 Şarj'}</p>
                            <p><strong>Mesafe:</strong> ${leg.distance_km.toFixed(1)} km</p>
                            <p><strong>Süre:</strong> ${leg.duration_minutes} dakika</p>
                            ${leg.consumption_kwh ? `<p><strong>Tüketim:</strong> ${leg.consumption_kwh.toFixed(2)} kWh</p>` : ''}
                        </div>
                    `;
                });
                html += '</div>';
            }

            resultsDiv.innerHTML = html;
            document.getElementById('resultCard').style.display = 'block';
        }

        function showError(data) {
            const errorDiv = document.getElementById('errorResults');

            let html = `
                <div class="alert alert-danger">
                    <h5>Hata Türü: ${data.status}</h5>
                    <p>${data.detail || data.error || 'Bilinmeyen hata oluştu.'}</p>
                </div>
            `;

            if (data.status === 'error_no_station_found') {
                html += `
                    <div class="alert alert-warning">
                        <h6>⚠️ Not:</h6>
                        <p>Rota başarıyla hesaplandı ancak şarj istasyonları bulunamadı. 
                        Bu normal bir durumdur - Google Maps API entegrasyonu çalışıyor.</p>
                    </div>
                `;
            }

            errorDiv.innerHTML = html;
            document.getElementById('errorCard').style.display = 'block';
        }
    </script>
</body>

</html>
